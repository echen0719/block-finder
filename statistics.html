<canvas id="downloadsChart"></canvas>

<script>
  async function getStatistics() {
    try {
      const response = await fetch("https://raw.githubusercontent.com/echen0719/block-finder/refs/heads/26.2/curseforge-statistics.json")
  
      if (!response.ok) {
        console.log("Could not fetch JSON data");
      }
  
      return await response.json();
    }
    catch {
      // something happened
      return null;
    }
  }
  
  const json = await getStatistics();
  
  if (!json) console.log("No JSON for some reason")
  
  const data = json.queryResult.data.filter(item => item.day !== null).map(item => ({
      x: new Date(item.day), // convert from its standard UTC to an object
      y: item.total
  }));
  
  console.log(data);
</script>
