<canvas id="downloadsChart"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/date-fns@4.1.0/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
<script>
  async function getStatistics() {
    try {
      const response = await fetch("https://raw.githubusercontent.com/echen0719/block-finder/refs/heads/26.2/curseforge-statistics.json")

      if (!response.ok) {
        console.log("Could not fetch JSON data");
      }

      return await response.json();
    }
    catch {
      // something happened
      return null;
    }
  }

  async function main() {
    const json = await getStatistics();
    if (!json) console.log("No JSON for some reason")

    const data = json.queryResult.data.filter(item => item.day !== null).map(item => ({
        x: new Date(item.day), // convert from its standard UTC to an object
        y: item.total
    }));

    console.log(data);

    new Chart(document.getElementById("downloadsChart"), {
      type: "line",
      data: {
        datasets: [{
          label: "Downloads",
          data: data,
          fill: true,
        }]
      },
      options: {
        responsive: true,
        scales: {
          x: {
            type: "time",
            time: {
              unit: "day",
              tooltipFormat: "MMM d, yyyy"
            },
            title: {
              display: true,
              text: "Date"
            }
          },
          y: {
            beginAtZero: true,
            title: {
              display: true,
              text: "Downloads"
            }
          }
        }
      }
    });
  }

  main();
</script>
