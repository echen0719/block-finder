plugins {
    id 'java'
    id 'net.minecraftforge.gradle'
}

version = project.mod_version
group = project.maven_group

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }

    withSourcesJar()
}

sourceSets { // client and main
    main {
        java {
            srcDirs = [
                'src/main/java',
                'src/client/java',
                '../common/src/main/java',
                '../common/src/client/java'
            ]
        }

        resources {
            srcDirs = [
                'src/main/resources',
                'src/client/resources',
                '../common/src/main/resources',
                '../common/src/client/resources',
                'src/generated/resources'
            ]
        }

        output.setResourcesDir(file("$buildDir/classes/java/main"))
    }
}

repositories {
    mavenCentral()
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                block_finder {
                    source sourceSets.main
                }
            }
            args '--username', 'echen0719'
        }

        server {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                block_finder {
                    source sourceSets.main
                }
            }
            args '--nogui'
        }

        data {
            workingDirectory project.file('run')
            
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                block_finder {
                    source sourceSets.main
                }
            }
            args '--mod', 'block_finder',
                '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

// HoW doEs tHiS wOrK? It took so long
// But this seems to have solved the
// Mod not found error, bruh
tasks.withType(JavaCompile).configureEach {
	dependsOn tasks.named('processResources')
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('processResources') {
    destinationDir = file("$buildDir/classes/java/main")
}
